<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- Safari ignores `user-scalable=no`, so its own pinch-zoom gestures are turned down here -->
        <script>['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});</script>
        <title>MVT Arcade</title>
        <meta name="description" content="Games, demos and art, each built with Model-View-Ticker, an architecture for games and interactive apps." />
        <!-- What a link to the page shows when it is shared. The build gives each entry's copy of the page its own -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MVT Arcade" />
        <meta property="og:title" content="MVT Arcade" />
        <meta property="og:description" content="Games, demos and art, each built with Model-View-Ticker, an architecture for games and interactive apps." />
        <link rel="stylesheet" href="/src/shared/nav.css" />
        <!-- Dark from the first frame, before the stylesheets arrive -->
        <style>html { background: #0d1117; color-scheme: dark; }</style>
    </head>
    <body>
        <nav class="site-nav">
            <button class="site-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <svg viewBox="0 0 20 20"><path d="M2 4.5h16M2 10h16M2 15.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            </button>
            <!-- Absolute, since the same page is also each entry's, one folder down -->
            <a class="site-nav-brand" href="%BASE_URL%arcade/">MVT Games</a>
            <ul class="site-nav-links">
                <li><a class="active" href="%BASE_URL%arcade/">
                    <svg class="site-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5h8a5 5 0 015 5v1.5a2.5 2.5 0 01-4.6 1.4L13 11H7l-1.4 1.9A2.5 2.5 0 011 11.5V10a5 5 0 015-5z"/><path d="M6 7.5v4M4 9.5h4"/><circle cx="13" cy="8.5" r=".6"/><circle cx="15" cy="10.5" r=".6"/></svg>
                    <span>Arcade</span>
                </a></li>
                <li><a href="%BASE_URL%docs/">
                    <svg class="site-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.5C8.5 4.3 6 4 2.5 4.5V15c3.5-.5 6 0 7.5 1.2 1.5-1.2 4-1.7 7.5-1.2V4.5C14 4 11.5 4.3 10 5.5zM10 5.5v10.7"/></svg>
                    <span>Docs</span>
                </a></li>
                <li><a href="%BASE_URL%playground/">
                    <svg class="site-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17.5V4M7 17.5V4M3 7.5h4M3 11h4M3 14.5h4"/><path d="M7 4c3.5 0 4.5 2.5 6 6.5s2.5 6 5.5 6"/></svg>
                    <span>Playground</span>
                </a></li>
                <li><a href="https://github.com/yortus/mvt-games" target="_blank" rel="noopener">
                    <svg class="site-nav-icon is-filled" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    <span>GitHub</span>
                </a></li>
            </ul>
            <div class="site-nav-spacer"></div>
            <!-- The arcade's own tools, which its views fill: the search, the sound, the Perfmon and the (i) -->
            <div class="site-nav-tools" id="site-nav-tools"></div>
        </nav>
        <script>document.querySelector('.site-nav-toggle')?.addEventListener('click',function(){var n=this.closest('.site-nav');n.classList.toggle('site-nav--open');this.setAttribute('aria-expanded',n.classList.contains('site-nav--open'))});</script>

        <main id="arcade"></main>

        <script type="module" src="/src/arcade/main.ts"></script>
    </body>
</html>
