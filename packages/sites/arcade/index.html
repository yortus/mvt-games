<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
            The site's root. It sends the visitor on to the Arcade, keeping the
            query. A link from before the Arcade had its own folder named an
            entry in the fragment (`#crumb-chase`), and goes to that entry's own
            address. Only a script can read the fragment.
        -->
        <script>
            (function () {
                var id = location.hash.slice(1);
                var entry = /^[a-z0-9-]+$/.test(id) ? id + '/' : '';
                location.replace('%BASE_URL%arcade/' + entry + location.search);
            })();
        </script>
        <noscript><meta http-equiv="refresh" content="0; url=%BASE_URL%arcade/" /></noscript>
        <title>MVT Arcade</title>
        <meta name="description" content="Games, demos and art, each built with Model-View-Ticker, an architecture for games and interactive apps." />
        <!-- A link to the site's root, shared, shows the Arcade. The build adds the picture -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MVT Arcade" />
        <meta property="og:title" content="MVT Arcade" />
        <meta property="og:description" content="Games, demos and art, each built with Model-View-Ticker, an architecture for games and interactive apps." />
        <style>html { background: #0d1117; color-scheme: dark; }</style>
    </head>
    <body>
        <p><a href="%BASE_URL%arcade/" style="color: #58a6ff">Go to the MVT Arcade</a></p>
    </body>
</html>
