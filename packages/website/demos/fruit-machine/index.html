<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fruit Machine - MVT Demos</title>
        <link rel="stylesheet" href="/src/shared/nav.css" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body {
                width: 100%; height: 100%;
                background: #0d1117;
                color: #c9d1d9;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                overflow: hidden;
            }
            /* The site nav is fixed over the top of the page */
            body { display: flex; flex-direction: column; padding-top: var(--site-nav-height, 48px); }
            .caption {
                padding: 8px 16px;
                font-size: 13px;
                line-height: 1.5;
                border-bottom: 1px solid #21262d;
            }
            .caption strong { color: #e6edf3; }
            .caption a { color: #58a6ff; }
            /* The entry fills the rest of the page */
            #entry { position: relative; flex: 1; min-height: 0; }
        </style>
    </head>
    <body>
        <nav class="site-nav">
            <button class="site-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <svg viewBox="0 0 20 20"><path d="M2 4.5h16M2 10h16M2 15.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            </button>
            <a class="site-nav-brand" href="../../">MVT Games</a>
            <ul class="site-nav-links">
                <li><a href="../../games/">Games</a></li>
                <li><a class="active" href="../">Demos</a></li>
                <li><a href="../../docs/">Docs</a></li>
                <li><a href="../../playground/">Playground</a></li>
            </ul>
            <div class="site-nav-spacer"></div>
        </nav>
        <script>document.querySelector('.site-nav-toggle')?.addEventListener('click',function(){var n=this.closest('.site-nav');n.classList.toggle('site-nav--open');this.setAttribute('aria-expanded',n.classList.contains('site-nav--open'))});</script>

        <p class="caption">
            <strong>Fruit Machine:</strong> one model, four views. Play from any quadrant (the Pixi button, the 3D lever,
            the panel's buttons, or <code>spin</code> in the terminal) and all four follow, each in its own way. None of
            them knows the others exist.
            <a href="https://github.com/yortus/mvt-games/tree/main/packages/website/src/demos/fruit-machine">How it works</a>
        </p>

        <main id="entry"></main>

        <script type="module" src="/src/demos/fruit-machine/main.ts"></script>
    </body>
</html>
