<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- Safari ignores `user-scalable=no`, so its own pinch-zoom gestures are turned down here -->
        <script>['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});</script>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            html,
            body {
                /* Zooming the page is off across the site */
                touch-action: pan-x pan-y;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #1a1a2e;
            }
        </style>
    </head>
    <body>
        <script type="module" src="/src/playground/sandbox/sandbox-runner.ts"></script>
    </body>
</html>
