name: Visual tests spike (042)

# Runs the 042 spike on GitHub's runners, to compare their pictures with the
# references made on Windows. Only on the spike's branch.
on:
    push:
        branches: [visual-tests]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: visual-spike-${{ github.ref }}
    cancel-in-progress: true

jobs:
    spike:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        env:
            VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci

            - name: Install Playwright's headless shell
              run: |
                  if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium-headless-shell
                  else npx playwright install chromium-headless-shell; fi

            - name: Calibration and entries, against the Windows references
              continue-on-error: true
              env:
                  SPIKE_MODE: compare
                  SPIKE_LABEL: ci-${{ matrix.os }}-cal
                  SPIKE_INCLUDE: visual-spike/calibration.visual.tsx,visual-spike/entries.visual.tsx
              run: npx vitest run --config packages/website/visual-spike/vitest.config.ts

            - name: Speed suite, 1000 pictures (hashes compared afterwards)
              continue-on-error: true
              env:
                  SPIKE_MODE: update
                  SPIKE_REFS: __refs-ci__
                  SPIKE_LABEL: ci-${{ matrix.os }}-speed-update
                  SPIKE_INCLUDE: visual-spike/speed/generated/*.visual.tsx
              run: |
                  node packages/website/visual-spike/speed/generate.mjs
                  # First run writes the references (slow path); the second is the fast path, timed
                  npx vitest run --config packages/website/visual-spike/vitest.config.ts > /dev/null || true
                  start=$(node -p "Date.now()")
                  SPIKE_MODE=compare SPIKE_LABEL=ci-${{ matrix.os }}-speed npx vitest run --config packages/website/visual-spike/vitest.config.ts | tail -6
                  end=$(node -p "Date.now()")
                  echo "SPEED_WALL=$(( end - start )) ms" >> "$GITHUB_ENV"

            - name: Summary
              if: always()
              run: node packages/website/visual-spike/ci-summary.mjs ${{ matrix.os }}

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: visual-spike-${{ matrix.os }}
                  path: |
                      packages/website/visual-spike/results/ci-*.json
                      .vitest/visual/
                  if-no-files-found: ignore
