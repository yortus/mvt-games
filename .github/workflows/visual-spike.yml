name: Visual tests spike (042)

# Runs the 042 spike on GitHub's runners, to compare their pictures with the
# references made on Windows. Only on the spike's branch.
on:
    push:
        branches: [visual-tests]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: visual-spike-${{ github.ref }}
    cancel-in-progress: true

jobs:
    spike:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.os }}
        env:
            # This round: the HTML study only
            SPIKE_VARIANTS: h-blanktt-nohint
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci

            - name: Install Playwright's headless shell
              run: |
                  if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium-headless-shell
                  else npx playwright install chromium-headless-shell; fi

            - name: Every text variant, against the Windows references
              run: node packages/website/visual-spike/run-variants.mjs compare ci-${{ matrix.os }}

            - name: Summary
              if: always()
              run: node packages/website/visual-spike/ci-summary.mjs ${{ matrix.os }}

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: visual-spike-${{ matrix.os }}
                  path: |
                      packages/website/visual-spike/results/ci-*.json
                      .vitest/visual/
                  if-no-files-found: ignore
