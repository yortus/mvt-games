name: Deploy to GitHub Pages

# Builds the site, the playground and the docs, and deploys them to GitHub
# Pages. A push that changes only files none of them is built from, such as a
# README, a changelog, notes, or a package's own docs, deploys nothing.

on:
    push:
        branches: [main]
        paths-ignore:
            - '**/README.md'
            - '**/CHANGELOG.md'
            - '**/CONTRIBUTING.md'
            - AGENTS.md
            - notes/**
            - .changeset/**
            - .claude/**
            - packages/libraries/chiptune/docs/**
            - packages/tools/v-snap/docs/**
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run test:unit
            - run: npm run build:arcade
              env:
                  BASE_URL: /${{ github.event.repository.name }}/
                  # Where the site is served, for the full addresses each entry's link preview needs
                  SITE_ORIGIN: https://yortus.com
                  # The Worker that keeps the Arcade's highscore tables (deploy-highscores.yml)
                  VITE_HIGHSCORES_URL: https://highscores.yortus.workers.dev
            - run: npm run build:playground
              env:
                  BASE_URL: /${{ github.event.repository.name }}/
            # With the Arcade and the playground built: each holds one copy of @mvtjs/utils, as a second throws on load
            - run: npm run check:one-copy-of-utils
            - run: npm run build:docs
              env:
                  BASE_URL: /${{ github.event.repository.name }}/

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
