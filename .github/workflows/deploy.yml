name: Deploy to GitHub Pages

# Builds the site, the playground and the docs, prints the book as a PDF, and
# deploys them to GitHub Pages. A push that changes only files none of them is
# built from, such as a README, a changelog, notes, or a package's own docs,
# deploys nothing.

on:
    push:
        branches: [main]
        paths-ignore:
            - '**/README.md'
            - '**/CHANGELOG.md'
            - '**/CONTRIBUTING.md'
            - AGENTS.md
            - notes/**
            - .changeset/**
            - .claude/**
            - packages/libraries/audio90/docs/**
            - packages/libraries/v-snap/docs/**
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Where the site is served: its base, and its origin, for the full
            # addresses each page's link preview needs. The builds and the check
            # of the previews read them
            BASE_URL: /${{ github.event.repository.name }}/
            SITE_ORIGIN: https://yortus.com
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run test:unit
            # audio90's own tests, which the root's leave out. The site plays on its chips
            - run: npm test -w audio90
            # The arcade, the demos and the puzzles
            - run: npm run build:sites
              env:
                  # The Worker that keeps the highscore tables (deploy-highscores.yml)
                  VITE_HIGHSCORES_URL: https://highscores.yortus.workers.dev
            - run: npm run build:playground
            # With the sites and the playground built: each holds one copy of @mvtjs/utils, as a second throws on load
            - run: npm run check:one-copy-of-utils
            - run: npm run build:docs
            # With everything built: every page has what a link preview needs
            - run: npm run check:link-previews

            # The book as a PDF, printed from the built docs into
            # dist/docs/building-web-games-with-mvt.pdf, which the Preface and the
            # docs' sidebar link to. It's printed on every deploy, since a deploy
            # replaces the whole site. A book that no longer prints, such as one
            # with text lost off a page, fails the deploy, so the link never
            # goes to a missing or stale file. The browser is Playwright's
            # headless shell, from the cache or downloaded, as in visual.yml.
            - name: Where Playwright keeps its browser
              id: playwright
              run: |
                  echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
                  echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
              working-directory: packages/sites/docs

            - uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

            - run: npx playwright install chromium-headless-shell
              working-directory: packages/sites/docs
            - run: npm run print -w @mvtjs/docs

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
