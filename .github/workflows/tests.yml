name: Tests

# This workflow runs the unit tests (npm run test:unit), with audio90's own
# tests and v-snap's unit tests, and the slow tests (npm run test:slow), in
# two jobs side by side. The visual tests run in visual.yml.
#
# - On every push, and on demand. A push already runs a pull request's
#   commits, so a pull request runs them only when it comes from a fork.
# - The unit tests that run in plain Node share their workers' modules,
#   rather than each loading its own, so a file that leaves global state
#   changed can break the files after it. So they run in a new shuffled
#   order each time, and the log names the seed, which repeats the order:
#   `npm run test:unit -- --sequence.shuffle.files --sequence.seed=<seed>`.
on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run test:unit -- --sequence.shuffle.files --sequence.seed=${{ github.run_id }}
            # v-snap's own unit tests. Its visual tests run in visual.yml.
            - run: npm run test:unit -w v-snap
            # audio90's own tests, which the root's leave out
            - run: npm test -w audio90

    slow:
        name: Slow tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run test:slow
