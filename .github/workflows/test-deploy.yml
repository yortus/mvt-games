name: Deploy test branch to Surge

on:
    push:
        branches: [test]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: test-deploy
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        env:
            # Where the site is served: its base, and its origin, for the full
            # addresses each page's link preview needs. The builds and the check
            # of the previews read them
            BASE_URL: /
            SITE_ORIGIN: https://mvt-games-test.surge.sh
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run test:unit
            - run: npm run build:arcade
              env:
                  # The highscores Worker's test environment, with tables of its own (deploy-highscores.yml)
                  VITE_HIGHSCORES_URL: https://highscores-test.yortus.workers.dev
            - run: npm run build:playground
            # With the Arcade and the playground built: each holds one copy of @mvtjs/utils, as a second throws on load
            - run: npm run check:one-copy-of-utils
            - run: npm run build:docs
            # With all three built: every page has what a link preview needs
            - run: npm run check:link-previews

            # The playground's sandbox loads its modules across origins, which
            # needs CORS headers. GitHub Pages sends them; Surge sends them with this file.
            - run: echo '*' > dist/CORS
            - run: npx surge dist/ mvt-games-test.surge.sh
              env:
                  SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
                  SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
