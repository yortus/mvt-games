name: Release the libraries

# Publishes any @mvtjs library version not yet on npm, through npm's trusted
# publishing (no stored token), with provenance. On a push with no new version
# it publishes nothing. See .changeset/README.md for how a release is made.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write # to push the release tags
    id-token: write # for npm's trusted publishing

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run test
            - run: npm run build:packages

            # Changesets tags each published version with an annotated tag,
            # which needs an identity
            - run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - run: npx changeset publish
            - run: git push --follow-tags
